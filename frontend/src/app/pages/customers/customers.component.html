<section class="page">
  <div class="page-header">
    <h1>Customers</h1>
    <p>Everyone shopping at SuperMart, in one place.</p>
  </div>

  <div class="card add-card">
    <h3>Add a customer</h3>
    <div class="add-row">
      <input [(ngModel)]="newName" placeholder="Full name" />
      <input [(ngModel)]="newCity" placeholder="City" />
      <button class="btn btn-primary" (click)="add()" [disabled]="!newName || !newCity || submitting()">
        {{ submitting() ? 'Adding...' : 'Add' }}
      </button>
    </div>
    <div *ngIf="message()" class="msg" [class.success]="success()" [class.error]="!success()">{{ message() }}</div>
  </div>

  <div class="card table-card" *ngIf="!loading()">
    <table>
      <thead><tr><th>ID</th><th>Name</th><th>City</th></tr></thead>
      <tbody>
        <tr *ngFor="let c of customers()">
          <td>#{{ c.id }}</td>
          <td><strong>{{ c.name }}</strong></td>
          <td>{{ c.city }}</td>
        </tr>
      </tbody>
    </table>
    <p *ngIf="!customers().length" class="empty">No customers yet.</p>
  </div>

  <div *ngIf="loading()" class="state">Loading...</div>
</section>
